<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TwiDrop — ツイート保存</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <h1 class="logo">TwiDrop</h1>
    <p class="tagline">ツイートの本文・画像・動画をまとめて保存</p>
  </header>

  <main class="container">
    <form id="form" class="panel">
      <label class="field">
        <span class="label">ツイートの URL</span>
        <input id="url" type="text" placeholder="https://x.com/NASA/status/1362551461910114310"
               autocomplete="off" spellcheck="false" required>
      </label>
      <div class="actions">
        <label class="checkbox">
          <input id="with-media" type="checkbox" checked>
          <span>画像・動画も保存する</span>
        </label>
        <div class="buttons">
          <button id="preview-btn" type="submit" class="btn btn-secondary">プレビュー</button>
          <button id="save-btn" type="button" class="btn btn-primary">保存する</button>
        </div>
      </div>
    </form>

    <p id="status" class="status" hidden></p>

    <section id="preview" class="panel tweet-card" hidden>
      <div class="tweet-head">
        <img id="avatar" class="avatar" alt="" hidden>
        <div>
          <div id="author" class="author"></div>
          <a id="permalink" class="permalink" target="_blank" rel="noopener noreferrer">元のツイートを開く</a>
        </div>
      </div>
      <p id="tweet-text" class="tweet-text"></p>
      <div id="media-list" class="media-list"></div>
      <div id="meta" class="meta"></div>
    </section>

    <section id="result" class="panel" hidden>
      <h2 class="section-title">保存したファイル</h2>
      <ul id="file-list" class="file-list"></ul>
    </section>

    <section class="panel">
      <h2 class="section-title">保存済み一覧</h2>
      <ul id="saved-list" class="saved-list"><li class="empty">読み込み中…</li></ul>
    </section>
  </main>

  <footer class="footer">
    <p>公開ツイートのみ取得できます。保存したコンテンツの権利は投稿者に帰属します。私的な範囲でご利用ください。</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
